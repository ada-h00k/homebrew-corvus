name: Update Homebrew Casks

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update-casks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap repository
        uses: actions/checkout@v4
        with:
          repository: ada-h00k/homebrew-corvus
          token: ${{ secrets.CASKS_TOKEN }}

      - name: Determine the latest releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/ada-h00k/corvus/releases/latest --jq .tag_name)"
          CLI_TAG="$(gh api repos/ada-h00k/corvus-cli/releases/latest --jq .tag_name)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "cli_tag=${CLI_TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest Corvus release: ${TAG}"
          echo "Latest corvus-cli release: ${CLI_TAG}"

      - name: Download release assets and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo ada-h00k/corvus \
            --dir "$TMP" \
            --pattern 'corvus-macos-arm64.zip' \
            --pattern 'corvus-qt-macos-arm64.zip'
          gh release download "${{ steps.release.outputs.cli_tag }}" \
            --repo ada-h00k/corvus-cli \
            --dir "$TMP" \
            --pattern 'corvus-cli-macos-aarch64'
          echo "swift=$(sha256sum "$TMP/corvus-macos-arm64.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "qt=$(sha256sum "$TMP/corvus-qt-macos-arm64.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cli=$(sha256sum "$TMP/corvus-cli-macos-aarch64" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update cask files
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          CLI_TAG="${{ steps.release.outputs.cli_tag }}"
          sed -i "s|^  version .*|  version \"${TAG}\"|" \
            Casks/corvus-qt.rb Casks/corvus-swift.rb
          sed -i "s|^  sha256 .*|  sha256 \"${{ steps.sha.outputs.qt }}\"|" \
            Casks/corvus-qt.rb
          sed -i "s|^  sha256 .*|  sha256 \"${{ steps.sha.outputs.swift }}\"|" \
            Casks/corvus-swift.rb
          sed -i "s|^  version .*|  version \"${CLI_TAG}\"|" Casks/corvus-cli.rb
          sed -i "s|^  sha256 .*|  sha256 \"${{ steps.sha.outputs.cli }}\"|" Casks/corvus-cli.rb

      - name: Verify result
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          CLI_TAG="${{ steps.release.outputs.cli_tag }}"
          for f in Casks/corvus-qt.rb Casks/corvus-swift.rb; do
            grep -F "version \"${TAG}\"" "$f" > /dev/null \
              || { echo "ERROR: version not set in $f"; exit 1; }
            ruby -c "$f" > /dev/null \
              || { echo "ERROR: syntax error in $f"; exit 1; }
            echo "OK: $f"
          done
          grep -F "version \"${CLI_TAG}\"" Casks/corvus-cli.rb > /dev/null \
            || { echo "ERROR: corvus-cli version not set"; exit 1; }
          ruby -c Casks/corvus-cli.rb > /dev/null \
            || { echo "ERROR: syntax error in Casks/corvus-cli.rb"; exit 1; }
          echo "OK: Casks/corvus-cli.rb"
          echo "Updated casks: Corvus ${TAG}; corvus-cli ${CLI_TAG}" >> "$GITHUB_STEP_SUMMARY"
          cat Casks/corvus-qt.rb Casks/corvus-swift.rb Casks/corvus-cli.rb >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          CLI_TAG="${{ steps.release.outputs.cli_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/corvus-qt.rb Casks/corvus-swift.rb Casks/corvus-cli.rb
          if git diff --cached --quiet; then
            echo "No changes - casks are already current."
            exit 0
          fi
          git commit -m "chore: update casks (Corvus ${TAG}, corvus-cli ${CLI_TAG})"
          git push
