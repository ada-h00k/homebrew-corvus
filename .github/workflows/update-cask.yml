name: Update Wren Cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Get latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="$(gh api repos/ada-h00k/Wren/releases/latest)"
          TAG="$(jq -r '.tag_name' <<< "$RELEASE")"
          URL="$(jq -r '
            .assets[]
            | select(.name == "wren-macos-arm64.zip")
            | .browser_download_url
          ' <<< "$RELEASE")"

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "::error::No latest release tag found"
            exit 1
          fi

          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "::error::macOS ARM64 asset not found"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download and verify checksum
        id: checksum
        env:
          DOWNLOAD_URL: ${{ steps.release.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            "$DOWNLOAD_URL" -o "$RUNNER_TEMP/wren.zip"

          SHA="$(shasum -a 256 "$RUNNER_TEMP/wren.zip" | awk '{print $1}')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update Cask
        env:
          TAG: ${{ steps.release.outputs.tag }}
          URL: ${{ steps.release.outputs.url }}
          SHA: ${{ steps.checksum.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > Casks/wren-swift.rb <<EOF
          cask "wren-swift" do
            version "${TAG}"
            sha256 "${SHA}"

            url "${URL}"
            name "Wren"
            desc "Native macOS GUI for signal-cli with encrypted local chat history"
            homepage "https://github.com/ada-h00k/Wren"

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            app "Wren.app"
          end
          EOF

      - name: Commit changes if needed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- Casks/wren-swift.rb; then
            echo "Cask is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Casks/wren-swift.rb
          git commit -m "Update Wren to ${{ steps.release.outputs.tag }}"
          git push
